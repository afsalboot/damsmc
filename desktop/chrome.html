<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dr Abdulla’s Ayurvedic POS</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #183d2b;
        color: white;
        font:
          13px "Segoe UI",
          sans-serif;
      }
      header {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 150px 0 10px;
        -webkit-app-region: drag;
        user-select: none;
      }
      strong {
        font-weight: 500;
        white-space: nowrap;
        margin-right: 12px;
      }
      nav {
        display: flex;
        height: 100%;
        align-items: center;
        gap: 2px;
        -webkit-app-region: no-drag;
      }
      button {
        font: inherit;
        color: white;
        border: 0;
        background: transparent;
        border-radius: 4px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        background: #ffffff25;
        outline: 1px solid #ffffff60;
      }
    </style>
  </head>
  <body>
    <header>
      <nav aria-label="Application menu">
        <button data-menu="POS">POS</button
        ><button data-menu="Edit">Edit</button
        ><button data-menu="View">View</button>
      </nav>
    </header>
  </body>
</html>
